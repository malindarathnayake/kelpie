version: 2
# Pins without an updater rot; an updater without a cooldown pulls in a
# just-published (possibly hijacked) release. Majors arrive ungrouped for
# individual review.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    ignore:
      # 0.30.1+ diffs halfwidth kana + voiced mark as two columns, so the server's
      # backend replay blanks the voiced mark. Lift once the render path handles it.
      - dependency-name: ratatui
        versions: [">0.30.0"]
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
