name: Release

# Push a tag like v0.1.0 (matching Cargo.toml) to build the Windows and Mac
# packages and publish them as the latest GitHub release. The website links to
# releases/latest/download/<asset>, so the newest release is what people get.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset: kelpie-windows-x64.zip
          - target: aarch64-apple-darwin
            os: macos-14
            asset: kelpie-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Code signing goes here once the certificate is ready: signtool on
      # kelpie.exe (Windows), codesign + notarytool on kelpie (Mac).

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "kelpie-windows-x64"
          # Stages kelpie.exe with Microsoft's signed ConPTY and its notices.
          .\scripts\package_windows_conpty.ps1 `
            -KelpieExe target\${{ matrix.target }}\release\kelpie.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath (Join-Path $env:RUNNER_TEMP "conpty-only.zip")
          $reported = (& (Join-Path $stage "kelpie.exe") --version | Out-String).Trim()
          if ($reported -notmatch [regex]::Escape($version)) {
            throw "Packaged binary reports '$reported', expected $version"
          }
          Copy-Item distribution\release\install.ps1 $stage
          (Get-Content distribution\release\README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content (Join-Path $stage "README.txt") -NoNewline
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath ${{ matrix.asset }}

      - name: Package (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/kelpie-macos-arm64"
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/release/kelpie "$stage/kelpie"
          reported=$("$stage/kelpie" --version)
          case "$reported" in
            *"$version"*) ;;
            *) echo "Packaged binary reports '$reported', expected $version"; exit 1 ;;
          esac
          cp distribution/release/install.sh "$stage/"
          chmod 755 "$stage/kelpie" "$stage/install.sh"
          sed "s/@VERSION@/$version/" distribution/release/README.txt > "$stage/README.txt"
          tar -C "$RUNNER_TEMP" -czf ${{ matrix.asset }} kelpie-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum kelpie-windows-x64.zip kelpie-macos-arm64.tar.gz > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            kelpie-windows-x64.zip
            kelpie-macos-arm64.tar.gz
            SHA256SUMS.txt
          make_latest: true
          generate_release_notes: true
