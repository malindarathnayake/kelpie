name: Release

# Push a tag like v0.1.0 (matching Cargo.toml) to build the Windows and Mac
# packages and publish them as the latest GitHub release. The website links to
# releases/latest/download/<asset>, so the newest release is what people get.
#
# Three jobs, split by privilege. `build` and `sbom` run project code and tools
# with a read-only token. `publish` never runs project code: it receives the
# built files, signs an SLSA build-provenance attestation and creates the
# release in the `release` environment. A tag push can bypass a PR, so the
# dependency vulnerability gate runs again here on the tagged commit.
#
# Supply-chain rules (see SECURITY.md): actions pinned to full commit SHAs,
# no build cache in release builds, checkout never persists the token, and
# event data reaches shell only through env.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset: kelpie-windows-x64.zip
          - target: aarch64-apple-darwin
            os: macos-14
            asset: kelpie-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A published tag must be a stable vX.Y.Z equal to the Cargo.toml version.
      - name: Check release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not a stable vX.Y.Z release tag"; exit 1
          fi
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "v$CARGO_VERSION" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml version $CARGO_VERSION"; exit 1
          fi

      # rustup ships on every hosted runner, so no third-party action is needed.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN_VERSION"
          rustc --version

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      # No dependency cache: a poisoned cache entry would flow straight into the
      # published binary.
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET"

      # Code signing goes here once the certificate is ready: signtool on
      # kelpie.exe (Windows), codesign + notarytool on kelpie (Mac).

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG -replace '^v', ''
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "kelpie-windows-x64"
          # Stages kelpie.exe with Microsoft's signed ConPTY and its notices.
          .\scripts\package_windows_conpty.ps1 `
            -KelpieExe "target\$env:TARGET\release\kelpie.exe" `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath (Join-Path $env:RUNNER_TEMP "conpty-only.zip")
          $reported = (& (Join-Path $stage "kelpie.exe") --version | Out-String).Trim()
          if ($reported -notmatch [regex]::Escape($version)) {
            throw "Packaged binary reports '$reported', expected $version"
          }
          Copy-Item distribution\release\install.ps1 $stage
          (Get-Content distribution\release\README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content (Join-Path $stage "README.txt") -NoNewline
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $env:ASSET

      - name: Package (Mac)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="$RUNNER_TEMP/kelpie-macos-arm64"
          mkdir -p "$stage"
          cp "target/$TARGET/release/kelpie" "$stage/kelpie"
          reported=$("$stage/kelpie" --version)
          case "$reported" in
            *"$version"*) ;;
            *) echo "Packaged binary reports '$reported', expected $version"; exit 1 ;;
          esac
          cp distribution/release/install.sh "$stage/"
          chmod 755 "$stage/kelpie" "$stage/install.sh"
          sed "s/@VERSION@/$version/" distribution/release/README.txt > "$stage/README.txt"
          tar -C "$RUNNER_TEMP" -czf "$ASSET" kelpie-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM and vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Syft and Grype (pinned binaries)
        run: |
          curl -fsSL -o syft.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          curl -fsSL -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          printf '%s\n' \
            "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  syft.tar.gz" \
            "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  grype.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          tar -xzf grype.tar.gz grype
      # Cargo.lock is the full Rust dependency tree compiled into the binary;
      # the vendored Zig engine and Windows ConPTY are added from their pins.
      - name: Generate SBOMs and gate on high or critical
        run: |
          mkdir sbom
          ./syft scan file:Cargo.lock \
            -o cyclonedx-json=sbom/kelpie-sbom.cdx.json \
            -o spdx-json=sbom/kelpie-sbom.spdx.json
          python3 -I scripts/sbom_add_vendored.py . sbom/kelpie-sbom.cdx.json sbom/kelpie-sbom.spdx.json
          ./grype sbom:sbom/kelpie-sbom.cdx.json --fail-on high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write      # create the release
      id-token: write      # OIDC token for the Sigstore-signed attestation
      attestations: write  # store the attestation on the repository
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum kelpie-windows-x64.zip kelpie-macos-arm64.tar.gz \
            kelpie-sbom.cdx.json kelpie-sbom.spdx.json > SHA256SUMS.txt

      # Users verify with: gh attestation verify <file> --repo malindarathnayake/kelpie
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kelpie-windows-x64.zip
            dist/kelpie-macos-arm64.tar.gz

      # The hash table goes at the top of the release notes so it is visible
      # without downloading anything; GitHub appends the generated notes after it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Verify your download"
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r hash file; do
              echo "| \`$file\` | \`$hash\` |"
            done < dist/SHA256SUMS.txt
            echo
            echo "Check a file with \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (macOS: \`shasum -a 256 -c\`)"
            echo "or \`Get-FileHash <file>\` in PowerShell, and its build provenance with"
            echo "\`gh attestation verify <file> --repo $REPO\`. See SECURITY.md."
            echo
          } > notes.md
          gh release create "$TAG" dist/* --repo "$REPO" --verify-tag \
            --title "Kelpie $TAG" --notes-file notes.md --generate-notes --latest
