# Static analysis, secret scanning, workflow auditing and dependency scanning.
# Runs on every push to main, every PR, and weekly so new advisories surface
# without a commit. See SECURITY.md for the posture behind these choices.
#
# Scanner binaries are downloaded at an exact version and checked against a
# SHA-256 before they run; third-party scanner actions are not used. Tags on a
# scanner action can be force-pushed (the March 2026 trivy-action compromise),
# a verified binary digest cannot. Bump version and checksum together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour: ":00" crons queue behind everyone else's.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Rust and workflows, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload CodeQL results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust is analysed without a build (build-mode none), so the vendored Zig
      # terminal engine does not need to compile here.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a secret removed in a later commit is still in the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks (pinned binary)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # PRs scan their commit range; push and cron scan all history.
      # Known false positives are listed by fingerprint in .gitleaksignore.
      - name: "Scan (PR: diff-scoped, otherwise: full history)"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./gitleaks detect --source . --redact --log-opts "$BASE..$HEAD"
          else
            ./gitleaks detect --source . --redact
          fi

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zizmor (pinned binary)
        run: |
          curl -fsSL -o zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz zizmor
      # Online audits use the read-only token to check, among other things, that
      # every pinned SHA belongs to the action's repository (impostor commits).
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./zizmor --persona=pedantic .github/workflows

  dependencies:
    name: SBOM and vulnerability scan (Syft + Grype)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Syft and Grype (pinned binaries)
        run: |
          curl -fsSL -o syft.tar.gz https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          curl -fsSL -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          printf '%s\n' \
            "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  syft.tar.gz" \
            "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  grype.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          tar -xzf grype.tar.gz grype
      # Cargo.lock is the full Rust dependency tree that ships in the binary;
      # the vendored Zig engine and Windows ConPTY are added from their pins.
      # Grype's vulnerability database is fetched at run time; it is data, not
      # code, and Grype verifies its checksum.
      - name: Generate SBOM
        run: |
          ./syft scan file:Cargo.lock \
            -o cyclonedx-json=kelpie-sbom.cdx.json \
            -o spdx-json=kelpie-sbom.spdx.json
          python3 -I scripts/sbom_add_vendored.py . kelpie-sbom.cdx.json kelpie-sbom.spdx.json
      - name: Scan SBOM (fail on high or critical)
        run: ./grype sbom:kelpie-sbom.cdx.json --fail-on high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: kelpie-sbom.cdx.json
          retention-days: 30
